name: Prova bot quote

# Si lancia a mano da GitHub: Actions -> "Prova bot quote" -> Run workflow.
#   test      = prova completa (legenda + esempio di riepilogo e di avviso nel gruppo)
#   ora       = controllo subito delle prossime partite (come quello di 40 minuti prima)
#   apertura  = aggiorna subito l'elenco delle partite
#   riepilogo = riepilogo subito delle partite di domani (quello automatico delle 19 e' spento)
#   esempio   = prova grafica nel gruppo con quote vere: legenda, tre avvisi di 40 minuti prima (calo che tiene,
#               tornato indietro, solo gol), un esempio degli ultimi minuti e la riga «Non controllate»;
#               con "partita" = tutto anche apertura delle coppe e riepiloghi
#   altribook = prova di The Odds API (altri book): quali book e mercati rispondono sui 5 campionati, nel
#               registro (circa 16 crediti dei 500 del mese, nessuna chiamata OddsPapi)
#   perche    = prova del 🔎 perche': l'avviso come sarebbe adesso, con le quote dell'ultima lettura del bot e il
#               motivo scritto da Groq (nessuna chiamata OddsPapi): con "partita" = una squadra, la sua prossima
#               partita; vuoto o una competizione = le 3 partite piu' mosse dei prossimi 3 giorni
#   rivedi    = rilegge le partite gia' giocate (ultimi 8 giorni) come 40 minuti prima, con le regole di adesso:
#               "partita" vuoto = conto forti/medi/rumore della settimana e le 3 piu' forti nel gruppo;
#               "partita" con una squadra (es. Roma) = il messaggio di quella partita
# "partita" vale anche per test, ora e riepilogo e accetta una competizione: SA, PL, PD, BL1, FL1, CL, EL, ECL o
# "coppe" (es. test + coppe = prova sulle prossime partite delle coppe; rivedi + CL = conto della Champions).
# Ogni prova consuma da 0 a 4 chiamate delle 250 del mese (lo storico delle quote e' gratis).

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "test = prova completa · ora = controllo subito · apertura = elenco partite · riepilogo = riepilogo di domani · rivedi = partite gia' giocate · esempio = prova grafica nel gruppo · perche = prova del 🔎 perché"
        required: true
        default: test
        type: choice
        options: [test, ora, apertura, riepilogo, rivedi, esempio, perche, altribook]
      partita:
        description: "squadra (es. Roma) o competizione (SA, PL, PD, BL1, FL1, CL, EL, ECL, coppe); per rivedi vuoto = tutta la settimana"
        required: false
        default: ""
        type: string
      muto:
        description: "prova muta: i messaggi vanno solo nel registro di GitHub, non nel gruppo"
        required: false
        default: false
        type: boolean
      profilo:
        description: "campionati = il tuo bot · coppe = prova del bot di tuo fratello (sempre muta, stato a parte)"
        required: false
        default: campionati
        type: choice
        options: [campionati, coppe]

permissions:
  contents: write

concurrency:
  group: monitor-news      # stesso gruppo del bot notizie: mai insieme (stato condiviso)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        working-directory: telegram-calcio-bot
        run: pip install -r requirements.txt

      - name: Prova bot quote
        working-directory: telegram-calcio-bot
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          MODO: ${{ inputs.modo }}
          PARTITA: ${{ inputs.partita }}
          MUTO: ${{ inputs.muto }}
          PROFILO: ${{ inputs.profilo }}
        run: |
          ARGS=""
          if [ "$MUTO" = "true" ]; then ARGS="--muto"; fi
          if [ "$PROFILO" = "coppe" ]; then
            # prova del profilo coppe con la tua chiave: sempre muta, stato in una cartella temporanea (non si salva)
            export QUOTE_PROFILE=coppe QUOTE_STATE_DIR="$RUNNER_TEMP/coppe-state"
            ARGS="--muto"
          fi
          python monitor_quote.py --mode "$MODO" --partita "$PARTITA" $ARGS

      - name: Salva lo stato delle quote
        if: always()
        run: |
          git config user.name "calcio-bot"
          git config user.email "calcio-bot@users.noreply.github.com"
          FILE=telegram-calcio-bot/state/quote_state.json
          PACE=telegram-calcio-bot/state/mercato.csv
          [ -f "$FILE" ] || { echo "Niente da salvare."; exit 0; }
          cp "$FILE" "$RUNNER_TEMP/quote_state.json"
          # file per i Pace Index (mercato.csv): solo se questa prova l'ha cambiato (modo "ora")
          SAVE_PACE=0
          if [ -f "$PACE" ] && { ! git ls-files --error-unmatch "$PACE" >/dev/null 2>&1 || ! git diff --quiet -- "$PACE"; }; then
            cp "$PACE" "$RUNNER_TEMP/mercato.csv"
            SAVE_PACE=1
          fi
          # quote Pinnacle lette dal bot (storico fatto in casa): solo se questa prova le ha lette
          LIVE=telegram-calcio-bot/state/quote_live.json
          SAVE_LIVE=0
          if [ -f "$LIVE" ] && { ! git ls-files --error-unmatch "$LIVE" >/dev/null 2>&1 || ! git diff --quiet -- "$LIVE"; }; then
            cp "$LIVE" "$RUNNER_TEMP/quote_live.json"
            SAVE_LIVE=1
          fi
          for i in 1 2 3 4 5; do
            git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
            git reset --quiet --hard refs/remotes/origin/main
            cp "$RUNNER_TEMP/quote_state.json" "$FILE"
            git add "$FILE"
            if [ "$SAVE_PACE" = 1 ]; then
              cp "$RUNNER_TEMP/mercato.csv" "$PACE"
              git add "$PACE"
            fi
            if [ "$SAVE_LIVE" = 1 ]; then
              cp "$RUNNER_TEMP/quote_live.json" "$LIVE"
              git add "$LIVE"
            fi
            if git diff --staged --quiet; then
              echo "Stato invariato, niente da salvare."
              exit 0
            fi
            git commit --quiet -m "Aggiorna stato quote"
            if git push --quiet origin HEAD:main; then
              echo "Stato salvato."
              exit 0
            fi
            echo "Salvataggio non riuscito (tentativo $i di 5), riprovo..."
            sleep $((i * 4))
          done
          echo "::error::Stato quote non salvato dopo 5 tentativi"
          exit 1
