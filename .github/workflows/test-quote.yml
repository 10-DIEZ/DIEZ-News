name: Prova bot quote

# Si lancia a mano da GitHub: Actions -> "Prova bot quote" -> Run workflow.
#   test      = prova completa (legenda + esempio di riepilogo e di avviso nel gruppo)
#   ora       = controllo subito delle prossime partite (come quello di 40 minuti prima)
#   apertura  = aggiorna subito l'elenco delle partite
#   riepilogo = riepilogo subito delle partite di domani
#   rivedi    = rilegge le partite gia' giocate (ultimi 8 giorni) come 40 minuti prima, con le regole di adesso:
#               "partita" vuoto = conto forti/medi/rumore della settimana e le 3 piu' forti nel gruppo;
#               "partita" con una squadra (es. Roma) = il messaggio di quella partita
# "partita" vale anche per test, ora e riepilogo e accetta una competizione: SA, PL, PD, BL1, FL1, CL, EL, ECL o
# "coppe" (es. test + coppe = prova sulle prossime partite delle coppe; rivedi + CL = conto della Champions).
# Ogni prova consuma da 0 a 4 chiamate delle 250 del mese (lo storico delle quote e' gratis).

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "test = prova completa · ora = controllo subito · apertura = elenco partite · riepilogo = riepilogo di domani · rivedi = partite gia' giocate"
        required: true
        default: test
        type: choice
        options: [test, ora, apertura, riepilogo, rivedi]
      partita:
        description: "squadra (es. Roma) o competizione (SA, PL, PD, BL1, FL1, CL, EL, ECL, coppe); per rivedi vuoto = tutta la settimana"
        required: false
        default: ""
        type: string
      muto:
        description: "prova muta: i messaggi vanno solo nel registro di GitHub, non nel gruppo"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: monitor-news      # stesso gruppo del bot notizie: mai insieme (stato condiviso)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        working-directory: telegram-calcio-bot
        run: pip install -r requirements.txt

      - name: Prova bot quote
        working-directory: telegram-calcio-bot
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          MODO: ${{ inputs.modo }}
          PARTITA: ${{ inputs.partita }}
          MUTO: ${{ inputs.muto }}
        run: |
          ARGS=""
          if [ "$MUTO" = "true" ]; then ARGS="--muto"; fi
          python monitor_quote.py --mode "$MODO" --partita "$PARTITA" $ARGS

      - name: Salva lo stato delle quote
        if: always()
        run: |
          git config user.name "calcio-bot"
          git config user.email "calcio-bot@users.noreply.github.com"
          FILE=telegram-calcio-bot/state/quote_state.json
          [ -f "$FILE" ] || { echo "Niente da salvare."; exit 0; }
          cp "$FILE" "$RUNNER_TEMP/quote_state.json"
          for i in 1 2 3 4 5; do
            git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
            git reset --quiet --hard refs/remotes/origin/main
            cp "$RUNNER_TEMP/quote_state.json" "$FILE"
            git add "$FILE"
            if git diff --staged --quiet; then
              echo "Stato invariato, niente da salvare."
              exit 0
            fi
            git commit --quiet -m "Aggiorna stato quote"
            if git push --quiet origin HEAD:main; then
              echo "Stato salvato."
              exit 0
            fi
            echo "Salvataggio non riuscito (tentativo $i di 5), riprovo..."
            sleep $((i * 4))
          done
          echo "::error::Stato quote non salvato dopo 5 tentativi"
          exit 1
