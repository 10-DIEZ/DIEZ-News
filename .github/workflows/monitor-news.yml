name: Monitor notizie (allenatori e turnover)

on:
  schedule:
    - cron: "0 */3 * * *"  # ogni 3 ore
  workflow_dispatch: {}     # permette di lanciarlo a mano da GitHub

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        working-directory: telegram-calcio-bot
        run: pip install -r requirements.txt

      - name: Esegui controllo notizie
        working-directory: telegram-calcio-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_news.py

      - name: Salva lo stato aggiornato
        run: |
          git config user.name "calcio-bot"
          git config user.email "calcio-bot@users.noreply.github.com"
          git add telegram-calcio-bot/state/state.json
          git diff --staged --quiet || git commit -m "Aggiorna stato notizie"
          git push
