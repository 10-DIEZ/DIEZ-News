name: Aggiorna calendario partite di oggi

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC (~09:00 in Italia)
    - cron: "0 18 * * *"  # 18:00 UTC (~20:00 in Italia)
  workflow_dispatch: {}    # permette di lanciarlo a mano da GitHub

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        working-directory: telegram-calcio-bot
        run: pip install -r requirements.txt

      - name: Aggiorna calendario partite
        working-directory: telegram-calcio-bot
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python monitor_structured.py

      - name: Salva lo stato aggiornato
        run: |
          git config user.name "calcio-bot"
          git config user.email "calcio-bot@users.noreply.github.com"
          git add telegram-calcio-bot/state/state.json
          git diff --staged --quiet || git commit -m "Aggiorna calendario partite"
          git push
