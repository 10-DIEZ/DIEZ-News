name: Monitor infortuni e squalifiche

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC (~09:00 in Italia)
    - cron: "0 18 * * *"  # 18:00 UTC (~20:00 in Italia)
  workflow_dispatch: {}    # permette di lanciarlo a mano da GitHub

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui controllo infortuni/squalifiche
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python monitor_structured.py

      - name: Salva lo stato aggiornato
        run: |
          git config user.name "calcio-bot"
          git config user.email "calcio-bot@users.noreply.github.com"
          git add state/state.json
          git diff --staged --quiet || git commit -m "Aggiorna stato infortuni/squalifiche"
          git push
