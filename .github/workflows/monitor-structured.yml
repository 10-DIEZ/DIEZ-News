name: Aggiorna calendario partite e squadre

on:
  schedule:
    # 4 volte al giorno (ore italiane ~7:17, 13:17, 19:17, 1:17), lontano dal minuto :00
    - cron: "17 5,11,17,23 * * *"
  workflow_dispatch: {}    # permette di lanciarlo a mano da GitHub

permissions:
  contents: write

concurrency:
  group: monitor-structured
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: main    # sempre l'ultima versione (vedi monitor-news.yml)

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        working-directory: telegram-calcio-bot
        run: pip install -r requirements.txt

      - name: Aggiorna calendario partite
        working-directory: telegram-calcio-bot
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python monitor_structured.py

      - name: Salva lo stato aggiornato
        run: |
          git config user.name "calcio-bot"
          git config user.email "calcio-bot@users.noreply.github.com"
          FILE=telegram-calcio-bot/state/fixtures.json
          cp "$FILE" "$RUNNER_TEMP/fixtures.json"
          # Si riparte dall'ultima versione di main e ci si rimette sopra il
          # calendario appena scaricato: niente conflitti con il bot notizie,
          # che nel frattempo salva il suo file (state.json) ogni 5 minuti.
          for i in 1 2 3 4 5; do
            git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
            git reset --quiet --hard refs/remotes/origin/main
            cp "$RUNNER_TEMP/fixtures.json" "$FILE"
            git add "$FILE"
            if git diff --staged --quiet; then
              echo "Calendario invariato, niente da salvare."
              exit 0
            fi
            git commit --quiet -m "Aggiorna calendario partite"
            if git push --quiet origin HEAD:main; then
              echo "Calendario salvato."
              exit 0
            fi
            echo "Salvataggio non riuscito (tentativo $i di 5), riprovo..."
            sleep $((i * 4))
          done
          echo "::error::Calendario non salvato dopo 5 tentativi"
          exit 1
