name: Aggiorna calendario partite e squadre

on:
  schedule:
    # 4 volte al giorno (ore italiane ~7:17, 13:17, 19:17, 1:17), lontano dal minuto :00
    - cron: "17 5,11,17,23 * * *"
  workflow_dispatch: {}    # permette di lanciarlo a mano da GitHub

permissions:
  contents: write

concurrency:
  group: monitor-structured
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        working-directory: telegram-calcio-bot
        run: pip install -r requirements.txt

      - name: Aggiorna calendario partite
        working-directory: telegram-calcio-bot
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python monitor_structured.py

      - name: Salva lo stato aggiornato
        run: |
          git config user.name "calcio-bot"
          git config user.email "calcio-bot@users.noreply.github.com"
          git add telegram-calcio-bot/state/fixtures.json
          git diff --staged --quiet && exit 0
          git commit -m "Aggiorna calendario partite"
          # Se nel frattempo il bot notizie ha salvato il suo file, prima
          # recuperiamo la sua modifica e poi salviamo (fino a 3 tentativi)
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
